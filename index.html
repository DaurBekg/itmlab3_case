<html lang="ru">
<head>
<meta charset="UTF-8">

<title>ITMLab 3.0 — Кейсы / Кейстер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --brand:#00B5D1;
  --brand-dark:#007A9E;
  --brand-light:#EAF7FB;
  --brand-mid:#C2EAF4;
  --text:#1A1A1A;
  --text-mid:#3D3D3D;
  --text-muted:#666;
  --bg:#F8FBFD;
  --card:#FFFFFF;
  --border:#DDF0F6;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 12px rgba(0,181,209,0.10),0 1px 3px rgba(0,0,0,0.06);
  --shadow-hover:0 6px 24px rgba(0,181,209,0.18),0 2px 6px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:16px}

/* ── HEADER ── */
header{background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 100%);color:#fff;padding:32px 20px 28px}
.header-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.header-left{flex:1}
.logo{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-1px;line-height:1}
.header-sub{font-size:clamp(14px,3vw,17px);opacity:.92;margin-top:6px;font-weight:500}
.header-org{font-size:13px;opacity:.72;margin-top:4px}

/* ── LANG TOGGLE ── */
.lang-toggle{display:flex;gap:4px;flex-shrink:0;margin-top:4px}
.lang-btn{background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.35);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .18s;letter-spacing:.5px}
.lang-btn:hover{background:rgba(255,255,255,0.28)}
.lang-btn.active{background:#fff;color:var(--brand-dark);border-color:#fff}

/* ── INTRO ── */
.intro{max-width:900px;margin:32px auto;padding:0 20px}
.intro-box{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow)}
.intro-box p{color:var(--text-mid);font-size:15px;line-height:1.75}
.intro-box p+p{margin-top:12px}
.stats{display:flex;gap:20px;margin-top:18px;flex-wrap:wrap}
.stat{background:var(--brand-light);border-radius:8px;padding:10px 18px;text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--brand-dark);line-height:1}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:500}

/* ── CASE NAV ── */
.case-nav{position:sticky;top:0;z-index:100;background:rgba(248,251,253,0.95);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--border);padding:10px 20px}
.nav-inner{max-width:900px;margin:0 auto}
.nav-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-pill{flex-shrink:0;background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-pill:hover{border-color:var(--brand);color:var(--brand)}
.nav-pill.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── MAIN ── */
main{max-width:900px;margin:0 auto;padding:20px 20px 60px}

/* ── CASE CARD ── */
.case-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;border:1.5px solid var(--border);transition:box-shadow .2s}
.case-card:hover{box-shadow:var(--shadow-hover)}
.case-header{background:linear-gradient(100deg,var(--brand-dark),var(--brand));padding:20px 24px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;user-select:none}
.case-num{font-size:42px;font-weight:800;color:rgba(255,255,255,0.25);line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums}
.case-title{font-size:clamp(16px,3.5vw,21px);font-weight:700;color:#fff;line-height:1.3}
.case-toggle{margin-left:auto;flex-shrink:0;font-size:20px;color:rgba(255,255,255,0.75);transition:transform .25s}
.case-card.open .case-toggle{transform:rotate(180deg)}
.case-body{display:none;padding:0}
.case-card.open .case-body{display:block}

/* ── SECTION ── */
details{border-bottom:1px solid var(--border)}
details:last-child{border-bottom:none}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 24px;cursor:pointer;user-select:none;font-weight:600;font-size:14px;color:var(--brand-dark);letter-spacing:.3px;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
.sum-icon{width:28px;height:28px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.sum-arrow{margin-left:auto;color:var(--brand);font-size:16px;transition:transform .2s}
details[open] .sum-arrow{transform:rotate(180deg)}
.section-content{padding:4px 24px 20px 64px}
.section-content p{font-size:15px;color:var(--text-mid);line-height:1.75}
.section-content ul{list-style:none;margin-top:4px}
.section-content li{font-size:15px;color:var(--text-mid);line-height:1.7;padding:4px 0 4px 20px;position:relative}
.section-content li::before{content:"•";position:absolute;left:4px;color:var(--brand);font-weight:700}
/* first section (problem) always open */
.case-card .case-body details.problem-section{border-top:none}

/* ── CASE 11 special ── */
.case-11 .case-header{background:linear-gradient(100deg,#1F6B8C,#00B5D1)}
.case-11-box{padding:20px 24px;background:var(--brand-light);border-radius:var(--radius-sm);margin:0 24px 20px}
.case-11-box p{font-size:15px;color:var(--text-mid);line-height:1.75;margin-bottom:10px}
.check-questions{margin-top:4px}
.check-questions li{font-size:14.5px;color:var(--text-mid);line-height:1.7;padding:5px 0 5px 20px;position:relative}
.check-questions li::before{content:"?";position:absolute;left:0;color:var(--brand-dark);font-weight:800;font-size:13px}

/* ── BACK TO TOP ── */
#backTop{position:fixed;bottom:24px;right:20px;background:var(--brand);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,181,209,0.40);display:none;align-items:center;justify-content:center;z-index:200;transition:background .15s}
#backTop:hover{background:var(--brand-dark)}
#backTop.visible{display:flex}

/* ── FOOTER ── */
footer{background:var(--brand-dark);color:rgba(255,255,255,0.85);text-align:center;padding:24px 20px;font-size:13.5px}
footer a{color:rgba(255,255,255,0.75);text-decoration:none}
footer a:hover{color:#fff;text-decoration:underline}
footer p+p{margin-top:6px}

/* ── RESPONSIVE ── */
@media(max-width:520px){
  .header-inner{flex-direction:column;gap:12px}
  .intro-box{padding:18px}
  .case-header{padding:16px 18px 14px}
  .case-num{font-size:32px}
  summary{padding:14px 18px;font-size:13px}
  .section-content{padding:4px 18px 16px 52px}
  .case-11-box{margin:0 18px 16px;padding:16px}
}
</style>

// ══════════════════════════════════════════════════════════════════
//  STATE & RENDER
// ══════════════════════════════════════════════════════════════════
let lang = 'ru';

const ICONS = {
  problem:'🔍', why:'💡', task:'🎯', notes:'📋', dirs:'🧭'
};

function applyUI(){
  const u = UI[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(u[k]) el.textContent = u[k];
  });
  document.documentElement.lang = lang;
}

function buildNav(){
  const u = UI[lang];
  const nav = document.getElementById('navScroll');
  nav.innerHTML = '';
  CASES.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'nav-pill';
    btn.dataset.caseId = c.id;
    btn.textContent = `${u.caseLabel} ${c.id}`;
    btn.addEventListener('click',()=>{
      document.getElementById('case-'+c.id)?.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(btn);
  });
  // case 11
  const btn11 = document.createElement('button');
  btn11.className = 'nav-pill';
  btn11.dataset.caseId = 11;
  btn11.textContent = `${u.caseLabel} 11`;
  btn11.addEventListener('click',()=>{
    document.getElementById('case-11')?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  nav.appendChild(btn11);
}

function makeSection(icon, label, content, isUl, openByDefault){
  const d = document.createElement('details');
  if(openByDefault) d.setAttribute('open','');
  if(openByDefault) d.classList.add('problem-section');
  d.innerHTML = `
    <summary>
      <span class="sum-icon">${icon}</span>
      ${label}
      <span class="sum-arrow">▾</span>
    </summary>
    <div class="section-content">
      ${isUl
        ? '<ul>'+content.map(t=>`<li>${t}</li>`).join('')+'</ul>'
        : `<p>${content}</p>`
      }
    </div>`;
  return d;
}

function buildCases(){
  const u = UI[lang];
  const container = document.getElementById('casesContainer');
  container.innerHTML = '';

  CASES.forEach(c=>{
    const d = c[lang];
    const card = document.createElement('article');
    card.className = 'case-card open';
    card.id = 'case-'+c.id;

    card.innerHTML = `
      <div class="case-header">
        <span class="case-num">${String(c.id).padStart(2,'0')}</span>
        <span class="case-title">${d.title}</span>
        <span class="case-toggle">▾</span>
      </div>
      <div class="case-body"></div>`;

    const body = card.querySelector('.case-body');
    body.appendChild(makeSection(ICONS.problem, u.secProblem, d.problem, false, true));
    body.appendChild(makeSection(ICONS.why,     u.secWhy,     d.why,     false, false));
    body.appendChild(makeSection(ICONS.task,    u.secTask,    d.task,    false, false));
    body.appendChild(makeSection(ICONS.notes,   u.secNotes,   d.notes,   true,  false));
    body.appendChild(makeSection(ICONS.dirs,    u.secDirs,    d.dirs,    true,  false));

    // toggle card open/close
    card.querySelector('.case-header').addEventListener('click', e=>{
      if(e.target.closest('details')||e.target.closest('summary')) return;
      card.classList.toggle('open');
    });

    container.appendChild(card);
  });

  // Case 11
  const c11d = CASE11[lang];
  const card11 = document.createElement('article');
  card11.className = 'case-card case-11 open';
  card11.id = 'case-11';
  card11.innerHTML = `
    <div class="case-header">
      <span class="case-num">11</span>
      <span class="case-title">${c11d.title}</span>
      <span class="case-toggle">▾</span>
    </div>
    <div class="case-body">
      <div class="case-11-box">
        <p>${c11d.desc}</p>
        <p>${c11d.desc2}</p>
        <p><strong>${c11d.notesTitle}</strong></p>
        <ul class="check-questions">
          ${c11d.notes.map(n=>`<li>${n}</li>`).join('')}
        </ul>
        <p style="margin-top:14px"><strong>${c11d.qTitle}</strong></p>
        <ul class="check-questions">
          ${c11d.questions.map(q=>`<li>${q}</li>`).join('')}
        </ul>
      </div>
    </div>`;
  card11.querySelector('.case-header').addEventListener('click',()=>{
    card11.classList.toggle('open');
  });
  container.appendChild(card11);
}

// Intersection Observer for nav highlight
function setupObserver(){
  const allIds = [...CASES.map(c=>'case-'+c.id), 'case-11'];
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id;
        const num = id.replace('case-','');
        document.querySelectorAll('.nav-pill').forEach(p=>{
          p.classList.toggle('active', p.dataset.caseId === num);
        });
      }
    });
  },{rootMargin:'-30% 0px -60% 0px'});
  allIds.forEach(id=>{
    const el = document.getElementById(id);
    if(el) obs.observe(el);
  });
}

// Back to top
window.addEventListener('scroll',()=>{
  const btn = document.getElementById('backTop');
  btn.classList.toggle('visible', window.scrollY > 400);
});

// Language switch
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    lang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
    applyUI();
    buildNav();
    buildCases();
    setupObserver();
  });
});

// Init
applyUI();
buildNav();
buildCases();
setupObserver();
</script>
