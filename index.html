<html lang="ru">
<head>

<title>ITMLab 3.0 — Кейсы / Кейстер</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#00B5D1;--brand-dark:#007A9E;--brand-light:#EAF7FB;
  --text:#1A1A1A;--text-mid:#3D3D3D;--text-muted:#666;
  --bg:#F8FBFD;--card:#fff;--border:#DDF0F6;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(0,181,209,.10),0 1px 3px rgba(0,0,0,.06);
  --shadow-hover:0 6px 24px rgba(0,181,209,.18),0 2px 6px rgba(0,0,0,.08);
  --green:#22C87A;--green-light:#EDFAF3;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:16px}
header{background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 100%);color:#fff;padding:28px 20px 24px}
.header-inner{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.header-left{flex:1}
h1.logo{font-size:clamp(26px,5.5vw,42px);font-weight:800;letter-spacing:-1px;line-height:1}
.header-sub{font-size:clamp(13px,2.8vw,16px);opacity:.9;margin-top:5px;font-weight:500}
.header-org{font-size:12.5px;opacity:.7;margin-top:3px}
.lang-toggle{display:flex;gap:4px;flex-shrink:0;margin-top:2px}
.lang-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:5px 13px;border-radius:8px;cursor:pointer;transition:all .18s}
.lang-btn:hover{background:rgba(255,255,255,.28)}
.lang-btn.active{background:#fff;color:var(--brand-dark);border-color:#fff}
.intro-section{max-width:920px;margin:28px auto 0;padding:0 20px}
.intro-box{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow)}
.intro-box p{color:var(--text-mid);font-size:15px;line-height:1.75}
.intro-box p+p{margin-top:10px}
.welcome-list{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:5px}
.welcome-list li{font-size:14.5px;color:var(--text-mid);padding-left:20px;position:relative;line-height:1.65}
.welcome-list li::before{content:"\2192";position:absolute;left:0;color:var(--brand-dark);font-weight:700}
.stats{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.stat{background:var(--brand-light);border-radius:8px;padding:9px 16px;text-align:center}
.stat-num{font-size:24px;font-weight:800;color:var(--brand-dark);line-height:1}
.stat-label{font-size:11.5px;color:var(--text-muted);margin-top:1px;font-weight:500}
.block-section{max-width:920px;margin:20px auto 0;padding:0 20px}
.block-box{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.block-head{background:var(--brand-dark);padding:13px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.block-head h2{font-size:15px;font-weight:700;color:#fff;flex:1}
.block-head-icon{font-size:17px}
.block-toggle{font-size:15px;color:rgba(255,255,255,.75);transition:transform .2s;margin-left:auto}
.block-box.open .block-toggle{transform:rotate(180deg)}
.block-body{display:none;padding:16px 20px}
.block-box.open .block-body{display:block}
.checklist-table{width:100%;border-collapse:collapse;font-size:14px}
.checklist-table th{background:var(--brand-light);padding:9px 13px;text-align:left;color:var(--brand-dark);font-weight:700;border:1.5px solid var(--border)}
.checklist-table td{padding:9px 13px;border:1.5px solid var(--border);color:var(--text-mid);vertical-align:top;line-height:1.65}
.checklist-table tr:nth-child(even) td{background:#FAFEFF}
.checklist-table td:first-child{font-weight:600;color:var(--text);width:30%}
.crit-grid{display:flex;flex-direction:column;gap:10px}
.crit-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
.crit-info{grid-column:1/2}
.crit-label{font-size:14px;font-weight:600;color:var(--text)}
.crit-desc{font-size:12.5px;color:var(--text-muted);margin-top:1px}
.crit-pct{font-size:17px;font-weight:800;color:var(--brand-dark);text-align:right;grid-column:2/3}
.crit-bar{height:7px;background:var(--border);border-radius:6px;overflow:hidden;grid-column:1/-1}
.crit-fill{height:100%;background:linear-gradient(90deg,var(--brand-dark),var(--brand));border-radius:6px}
.case-nav{position:sticky;top:0;z-index:100;background:rgba(248,251,253,.97);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--border);padding:8px 20px}
.nav-inner{max-width:920px;margin:0 auto}
.tech-filter-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 0 7px;border-bottom:1px solid var(--border);margin-bottom:6px}
.tech-filter-row::-webkit-scrollbar,.nav-pills-row::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--brand);color:var(--brand)}
.filter-btn.active{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.nav-pills-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.nav-pill{flex-shrink:0;background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:18px;cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-pill:hover{border-color:var(--brand);color:var(--brand)}
.nav-pill.active{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:920px;margin:20px auto 0;padding:0 20px 20px}
.case-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;border:1.5px solid var(--border);transition:box-shadow .2s}
.case-card:hover{box-shadow:var(--shadow-hover)}
.case-card.hidden{display:none}
.case-header{background:linear-gradient(100deg,var(--brand-dark),var(--brand));padding:17px 20px 15px;display:flex;align-items:center;gap:13px;cursor:pointer;user-select:none;border:none;width:100%;text-align:left;font-family:inherit}
.case-num{font-size:36px;font-weight:800;color:rgba(255,255,255,.22);line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums}
.case-header-text{flex:1;min-width:0}
.case-title{font-size:clamp(14px,3vw,18px);font-weight:700;color:#fff;line-height:1.3;display:block}
.case-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.case-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff}
.case-toggle{margin-left:6px;flex-shrink:0;font-size:17px;color:rgba(255,255,255,.7);transition:transform .25s}
.case-card.open .case-toggle{transform:rotate(180deg)}
.case-body{display:none}
.case-card.open .case-body{display:block}
.case-11 .case-header{background:linear-gradient(100deg,#1A5C7C,#00B5D1)}
details{border-bottom:1px solid var(--border)}
details:last-child{border-bottom:none}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;user-select:none;font-weight:600;font-size:12.5px;color:var(--brand-dark);letter-spacing:.3px;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
.sum-icon{width:25px;height:25px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.sum-arrow{margin-left:auto;color:var(--brand);font-size:13px;transition:transform .2s}
details[open] .sum-arrow{transform:rotate(180deg)}
.sec-content{padding:4px 20px 16px 55px}
.sec-content p{font-size:14.5px;color:var(--text-mid);line-height:1.75}
.sec-content ul{list-style:none;margin-top:6px}
.sec-content li{font-size:14.5px;color:var(--text-mid);line-height:1.7;padding:3px 0 3px 16px;position:relative}
.sec-content li::before{content:"\2022";position:absolute;left:2px;color:var(--brand);font-weight:700}
.case-table-wrap{padding:4px 20px 14px 55px}
.case-table{width:100%;border-collapse:collapse}
.case-table th{background:var(--brand-light);padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--brand-dark);text-align:left;border:1.5px solid var(--border)}
.case-table td{padding:9px 11px;font-size:14px;color:var(--text-mid);vertical-align:top;border:1.5px solid var(--border);line-height:1.65}
.ud-box{background:var(--green-light);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:10px 14px}
.ud-box p{font-size:14px;color:var(--text-mid);line-height:1.7}
.result-box{background:var(--brand-light);border-radius:8px;padding:10px 14px}
.result-box p{font-size:14px;color:var(--brand-dark);line-height:1.7;font-weight:500}
.self-check-section{max-width:920px;margin:8px auto 0;padding:0 20px 44px}
.self-check-inner{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow)}
.self-check-inner h2{font-size:16px;font-weight:700;color:var(--brand-dark);margin-bottom:13px}
.self-check-inner ol{list-style:none;counter-reset:sc;display:flex;flex-direction:column;gap:7px}
.self-check-inner li{counter-increment:sc;font-size:14.5px;color:var(--text-mid);padding-left:28px;position:relative;line-height:1.7}
.self-check-inner li::before{content:counter(sc);position:absolute;left:0;background:var(--brand-dark);color:#fff;width:19px;height:19px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;top:3px}
#backTop{position:fixed;bottom:20px;right:16px;background:var(--brand);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,181,209,.4);display:none;align-items:center;justify-content:center;z-index:200;transition:background .15s}
#backTop:hover{background:var(--brand-dark)}
#backTop.visible{display:flex}
footer{background:var(--brand-dark);color:rgba(255,255,255,.85);text-align:center;padding:20px;font-size:13px}
footer a{color:rgba(255,255,255,.75);text-decoration:none}
footer a:hover{color:#fff}
footer p+p{margin-top:4px}
@media(max-width:520px){
  .header-inner{flex-direction:column;gap:10px}
  .intro-box,.self-check-inner{padding:15px}
  .case-header{padding:13px 15px 11px}
  .case-num{font-size:28px}
  summary{padding:11px 15px;font-size:11.5px}
  .sec-content,.case-table-wrap{padding-left:42px}
  .block-body{padding:13px 15px}
  .checklist-table{font-size:12.5px}
  .checklist-table td:first-child{width:40%}
}
</style>
</head>

dirs:["AI-ассистент для адаптации задания: простой язык, аудио, субтитры, визуальные подсказки;","инструмент для педагога: как быстро адаптировать материал и проверить доступность урока;","платформа удалённой консультации: логопед, дефектолог, тифлопедагог, сурдопедагог;","тренажёр навыков с гибким темпом, голосовым управлением и доступной навигацией;","система отслеживания прогресса, понятная учащемуся, родителю и педагогу;","инклюзивный classroom-tool для групповой работы вместе с другими."],
ud:"Учебный материал должен быть доступен в нескольких форматах: текст, звук, видео, субтитры, пиктограммы, простой язык, разные способы ответа. Сообщество — учебная группа, родители, наставники, специалисты и выпускники — помогает человеку оставаться внутри общего образовательного процесса."},
kz:{title:"Кедергісіз білім алу және оқыту",
sit:"Мүгедектігі бар балалар мен ересектер бала бақшасында, мектепте, колледжде, жоғары оқу орнында, онлайн-курстарда және кәсіптік оқытуда кедергілерге тап болады. Қиыншылықтар тек мазмұнмен ғана емес, интерфейспен, қарқынмен, коммуникациямен, мамандардың болмауымен немесе қарапайым топтың дайын еместігімен де байланысты болуы мүмкін.",
task:"Оқуды қолжетімді ете отырып, адамды жеке оқшауланған маршруттарға бағытпай, жалпы білім беру ортасына қосуға мүмкіндік беретін технологиялық шешім әзірлеу.",
users:"Оқушы, студент, ересек тыңдаушы, педагог, тьютор, ата-ана, методист, білім беру платформасы, аймақтағы маман.",
mvp:"Минимум: сабақ экранының прототипі, AI-ны күрделі мәтінді түсінікті форматқа айналдыру, мұғалімге арналған бот, адаптивті тапсырма демосы немесе алыстағы маманды қосу схемасы.",
dirs:["AI-ассистент: қарапайым тіл, аудио, субтитрлер, визуалды нұсқаулар арқылы тапсырманы бейімдеу;","педагогқа арналған құрал: материалды жылдам бейімдеу және сабақ қолжетімділігін тексеру;","мамандармен қашықтан кеңес беру платформасы: логопед, дефектолог, тифлопедагог, сурдопедагог;","дауыстық басқарумен, икемді қарқынмен және қолжетімді навигациямен дағдылар тренажері;","оқушыға, ата-анаға және педагогқа түсінікті ілгерілеуді бақылау жүйесі;","оқушы басқалармен бірге қатысатын топтық жұмысқа арналған инклюзивтік classroom-tool."],
ud:"Жалпыға бірдей дизайн оқу материалын бірнеше форматта беруге болатынын білдіреді: мәтін, дауыс, бейне, субтитрлер, пиктограммалар, қарапайым тіл. Оқу тобы, ата-аналар, тәлімгерлер мен мамандар қоғамдастығы адамды жалпы білім беру процесі ішінде ұстауға көмектеседі."}
},
{id:4,tags:["nav","ai"],
ru:{title:"Передвижение и ориентация в городе",
sit:"Формально объект может считаться доступным, но человек не знает, работает ли лифт сегодня, где реальный вход, как пройти внутри здания, есть ли звуковая подсказка, кто поможет на месте и что изменилось в маршруте. Стресс, слабый интернет и отсутствие актуальной информации часто мешают человеку выйти из дома.",
task:"Разработать технологическое решение, которое делает маршрут предсказуемым от двери до участия: дорога, транспорт, вход, навигация внутри, получение услуги или участие в событии, возвращение домой.",
users:"Пользователь коляски, человек с нарушением зрения, слуха, когнитивными особенностями, пожилой человек, родитель с коляской, объект, транспортная служба, организатор мероприятия.",
mvp:"Минимум: кликабельный маршрут, прототип indoor-навигации, база объектов с актуальным статусом, QR-сценарий для площадки или демо обновления информации пользователями.",
dirs:["динамическая карта маршрута с актуальным статусом лифтов, входов, пандусов, туалетов, парковок;","indoor-навигация через QR, NFC, Bluetooth-маяки, AR-подсказки или аудиомаршрут;","краудсорсинг с верификацией данных самими пользователями и объектами;","интеграция с транспортом, мероприятиями и городскими службами;","маршрутный рейтинг уверенности: насколько безопасно пройти путь сегодня;","быстрая обратная связь объекту о барьере с фото, геометкой и статусом исправления."],
ud:"Маршрут должен быть понятен разным людям: визуальные подсказки, аудио, простой текст, контраст, крупные элементы, возможность заранее узнать условия. Сообщество пользователей помогает обновлять данные, а объекты и городские службы — подтверждать статус и отвечать на запросы."},
kz:{title:"Қалада жылжу және бағдарлау",
sit:"Формальды тұрғыдан нысан қолжетімді болуы мүмкін, бірақ адам лифт бүгін жұмыс жасайды ма, нақты кіреберіс қайда, ғимарат ішінде қалай жүру керек, дыбыстық нұсқаулар бар ма, кім орнында көмектеседі және маршрутта не өзгерді — осыларды білмейді. Стресс, нашар интернет пен өзекті ақпараттың болмауы адамның үйден шығуына жиі кедергі болады.",
task:"Маршрутты есіктен есікке дейін болжамды ететін технологиялық шешім әзірлеу: жол, көлік, кіреберіс, ішіндегі навигация, қызмет алу немесе іс-шараға қатысу, үйге оралу.",
users:"Коляска пайдаланушысы, көру, есту, когнитивтік ерекшеліктері бар адам, егде адам, балалы ата-ана, нысан, көлік қызметі, іс-шара ұйымдастырушысы.",
mvp:"Минимум: кликабельді маршрут, indoor-навигация прототипі, өзекті мәртебесі бар нысандар базасы, алаң үшін QR-сценарий немесе пайдаланушылардың ақпарат жаңартуының демосы.",
dirs:["лифттер, кіреберістер, пандустар, дәретханалар, тұрақтардың өзекті мәртебесі бар динамикалық маршрут картасы;","QR, NFC, Bluetooth-маяктар, AR-нұсқаулар немесе аудиомаршрут арқылы indoor-навигация;","пайдаланушылар мен нысандар тарапынан деректерді верификациялай отырып краудсорсинг;","көлікпен, іс-шаралармен және қалалық қызметтермен интеграция;","маршруттың сенімділік рейтингі: жолды бүгін қаншалықты қауіпсіз жүруге болады;","кедергі туралы фото, геобелгі мен түзету мәртебесі бар нысанға жылдам кері байланыс."],
ud:"Маршрут әр түрлі адамдарға түсінікті болуы тиіс: визуалды нұсқаулар, аудио, қарапайым мәтін, контраст, ірі элементтер, жағдайды алдын ала білу мүмкіндігі. Пайдаланушылар қоғамдастығы деректерді жаңартуға, ал нысандар мен қалалық қызметтер мәртебені растауға және сұраныстарға жауап беруге көмектеседі."}
},
{id:5,tags:["ai","gov"],
ru:{title:"Самостоятельный доступ к цифровым сервисам",
sit:"Банки, поликлиники, государственные услуги, социальные выплаты, доставка, образование и работа требуют цифровых действий. Барьеры возникают в капче, авторизации, мелких кнопках, сложных уведомлениях, непонятном юридическом языке, недоступных PDF, отсутствии голосового или альтернативного сценария.",
task:"Разработать технологию, которая помогает человеку пользоваться уже существующими цифровыми сервисами самостоятельно и безопасно, без передачи паролей, ЭЦП, телефона или персональных данных третьим лицам.",
users:"Пользователь с нарушением зрения, слуха, моторики, когнитивными особенностями, пожилой человек, оператор поддержки, разработчик сервиса, банк, поликлиника, госорган.",
mvp:"Минимум: прототип расширения, чат-бот объяснения формы, демо безопасного режима помощи, UX-аудит одного цифрового сервиса или сценарий голосового заполнения заявки.",
dirs:["браузерное расширение или мобильный слой доступности поверх существующего сайта;","AI-помощник, который объясняет шаги простым языком и проверяет ошибки до отправки;","голосовая навигация и управление без точного попадания в мелкие кнопки;","безопасная модель делегированной помощи: помощник видит только то, что разрешил пользователь;","проверка интерфейса на доступность и выдача рекомендаций разработчику;","адаптация сложных уведомлений, договоров и заявлений в понятный формат."],
ud:"Решение может быть полезно не только людям с инвалидностью, но и пожилым, людям с низкой цифровой грамотностью, иностранцам или людям в стрессовой ситуации. Сообщество пользователей может тестировать сервисы, давать обратную связь и помогать организациям исправлять интерфейсы."},
kz:{title:"Цифрлық сервистерге өз бетінше қол жеткізу",
sit:"Банктер, емханалар, мемлекеттік қызметтер, әлеуметтік төлемдер, жеткізу, білім мен жұмыс цифрлық әрекеттерді талап етеді. Кедергілер каптча, авторизация, ұсақ батырмалар, күрделі хабарландырулар, түсініксіз заңдық тіл, қолжетімсіз PDF, дауыстық немесе баламалы сценарийдің болмауында туындайды.",
task:"Адамға бар цифрлық сервистерді дербес және қауіпсіз пайдалануға мүмкіндік беретін технология әзірлеу, паролдерді, ЭЦҚ, телефонды немесе жеке деректерді үшінші тұлғаларға бермей.",
users:"Көру, есту, моторика бұзылысы бар, когнитивтік ерекшеліктері бар, егде адам, қолдау операторы, сервис әзірлеушісі, банк, емхана, мемлекеттік орган.",
mvp:"Минимум: кеңейтме прототипі, форманы түсіндіретін чат-бот, қауіпсіз қолдау режимінің демосы, бір цифрлық сервистің UX-аудиті немесе өтінімді дауыспен толтыру сценарийі.",
dirs:["бар сайтқа браузерлік кеңейтме немесе мобильді қолжетімділік деңгейі;","қадамдарды қарапайым тілде түсіндіретін және жіберу алдында қателерді тексеретін AI-көмекші;","ұсақ батырмаларға нақты тиюсіз дауыстық навигация мен басқару;","делегацияланған қолдаудың қауіпсіз моделі: көмекші тек пайдаланушы рұқсат берген нәрсені ғана көреді;","интерфейстің қолжетімділігін тексеру және әзірлеушіге ұсыным беру;","күрделі хабарландырулар, шарттар мен өтінімдерді түсінікті форматқа бейімдеу."],
ud:"Шешім мүгедектігі бар адамдарға ғана емес, егде адамдарға, цифрлық сауаттылығы төмендерге немесе стрессте жүргендерге де пайдалы бола алады. Пайдаланушылар қоғамдастығы сервистерді тестілеп, кері байланыс бере алады."}
},
{id:6,tags:["ai","work"],
ru:{title:"Труд и профессиональная занятость",
sit:"На пути к работе есть несколько барьеров: выбор подходящей задачи, описание навыков, собеседование, адаптация рабочего места, первые недели, коммуникация с командой, доверие работодателя и дальнейший рост. Обычная вакансия часто не показывает, какие условия реально нужны человеку и какие задачи он может выполнять хорошо.",
task:"Разработать технологическое решение, которое помогает человеку с инвалидностью, работодателю и команде найти работающий формат сотрудничества: от подбора задач до адаптации и сопровождения первых недель.",
users:"Кандидат, HR, руководитель, команда, джоб-коуч, карьерный консультант, НПО, центр занятости, работодатель.",
mvp:"Минимум: прототип профиля кандидата, AI-matching на тестовых вакансиях, чеклист адаптации рабочего процесса, бот сопровождения первых недель или dashboard джоб-коуча.",
dirs:["AI-подбор задач по навыкам, ограничениям, сильным сторонам и условиям работы;","цифровой профиль компетенций с портфолио, микрозаданиями и подтверждением навыков;","инструмент оценки доступности рабочего процесса, а не только рабочего места;","онбординг-ассистент для первых недель работы: задачи, коммуникация, обратная связь;","панель для джоб-коуча: цели, прогресс, риски, договорённости с работодателем;","симулятор для HR и команды: как проводить интервью без стереотипов."],
ud:"Универсальный дизайн в занятости помогает всем сотрудникам: ясные задачи, гибкие форматы коммуникации, понятная обратная связь, доступные документы. Сообщество может включать работодателей, наставников, выпускников, джоб-коучей и НПО."},
kz:{title:"Еңбек және кәсіби жұмыспен қамтылу",
sit:"Жұмысқа апарар жолда бірнеше кедергі бар: тиісті тапсырманы таңдау, дағдыларды сипаттау, сұхбат, жұмыс орнын бейімдеу, алғашқы апталар, командамен коммуникация, жұмыс берушінің сенімі және одан әрі өсу. Қарапайым вакансия жиі адамға нақты қандай жағдайлар қажет екенін және ол қандай тапсырмаларды жақсы орындай алатынын көрсетпейді.",
task:"Мүгедектігі бар адамға, жұмыс берушіге және командаға тапсырмаларды таңдаудан бастап алғашқы апталарды бейімдеу мен сүйемелдеуге дейін жұмысшы ынтымақтастық форматын табуға мүмкіндік беретін технологиялық шешім әзірлеу.",
users:"Үміткер, HR, басшы, команда, джоб-коуч, карьералық консультант, ҮЕҰ, жұмыспен қамту орталығы, жұмыс беруші.",
mvp:"Минимум: үміткер профилінің прототипі, тестілік вакансиялардағы AI-matching, жұмыс процесін бейімдеу тізімтізбесі, алғашқы апталарды сүйемелдеу боты немесе джоб-коуч dashboardы.",
dirs:["дағдылар, шектеулер, күшті жақтар мен жұмыс жағдайлары бойынша тапсырмаларды AI-іріктеу;","микротапсырмалар мен дағдыларды растаумен цифрлық құзыреттер профилі;","жұмыс орнын ғана емес, жұмыс процесінің қолжетімділігін бағалау құралы;","алғашқы жұмыс апталары үшін онбординг-ассистент: тапсырмалар, коммуникация, кері байланыс;","джоб-коучқа арналған панель: мақсаттар, ілгерілеу, тәуекелдер, жұмыс берушімен келісімдер;","HR мен команда үшін симулятор: стереотипсіз сұхбат жүргізу және тапсырмалар бөлу."],
ud:"Жұмыспен қамтудағы жалпыға бірдей дизайн барлық қызметкерлерге пайдалы: нақты тапсырмалар, коммуникацияның икемді форматтары, түсінікті кері байланыс, қолжетімді құжаттар. Қоғамдастық жұмыс берушілерді, тәлімгерлерді, джоб-коучтерді, ҮЕҰ мен кәсіби топтарды қамтуы мүмкін."}
},
{id:7,tags:["ai","ed"],
ru:{title:"Поддержка родителей и опекунов детей с инвалидностью",
sit:"Родитель часто становится координатором сложной системы: документы, специалисты, реабилитация, школа, домашние занятия, лекарства, права, финансы, поведение ребёнка. Информация разрознена, рекомендации могут противоречить друг другу, а в регионах доступ к специалистам ограничен.",
task:"Разработать технологическое решение, которое помогает семье ориентироваться, планировать действия, хранить важную информацию и получать поддержку специалистов или сообщества без перегрузки.",
users:"Родитель, опекун, ребёнок, школа, специалист, реабилитационный центр, социальный работник, родительское сообщество, НПО.",
mvp:"Минимум: прототип семейного кабинета, бот-навигатор, карта маршрута по услугам, шаблон передачи информации между школой и специалистом или демо базы проверенных ответов.",
dirs:["персональный цифровой план сопровождения ребёнка с напоминаниями и логикой следующего шага;","AI-навигатор по услугам, правам и документам на понятном языке;","единая карта наблюдений: прогресс, рекомендации, школьные заметки, вопросы специалисту;","модерируемое родительское сообщество с проверенными ответами и безопасными правилами;","телеконсультации и маршрутизация к специалистам в регионах;","документ-ассистент: какие справки, сроки и заявления нужны в конкретной ситуации."],
ud:"Интерфейс должен быть спокойным, простым и не медицинским. Желательно предусмотреть разные уровни детализации: короткий план для родителя и профессиональную информацию для специалиста. Сообщество родителей и специалистов встроено через модерацию, наставничество и обмен практическим опытом."},
kz:{title:"Мүгедек балалардың ата-аналары мен қамқоршыларын қолдау",
sit:"Ата-ана жиі күрделі жүйенің координаторына айналады: құжаттар, мамандар, оңалту, мектеп, үйдегі сабақтар, дәрі-дәрмектер, құқықтар, қаржы, баланың мінез-құлқы. Ақпарат шашыраңқы, ұсынымдар бір-біріне қайшы болуы мүмкін, ал аймақтарда мамандарға қол жеткізу шектеулі.",
task:"Отбасына бағдарлауға, іс-әрекеттерді жоспарлауға, маңызды ақпаратты сақтауға және мамандар немесе қоғамдастық қолдауын артық жүктемесіз алуға мүмкіндік беретін технологиялық шешім әзірлеу.",
users:"Ата-ана, қамқоршы, бала, мектеп, маман, оңалту орталығы, әлеуметтік қызметкер, ата-аналар қоғамдастығы, ҮЕҰ.",
mvp:"Минимум: отбасылық кабинет прототипі, навигатор-бот, қызметтер бойынша маршрут картасы, мектеп пен маман арасындағы ақпарат беру үлгісі немесе тексерілген жауаптар базасының демосы.",
dirs:["еске салулар мен келесі қадам логикасы бар баланы сүйемелдеудің жеке цифрлық жоспары;","қызметтер, құқықтар мен құжаттар бойынша қарапайым тілдегі AI-навигатор;","ілгерілеу, ұсынымдар, мектеп жазбалары, маманға сұрақтар бар бірыңғай бақылау картасы;","тексерілген жауаптары мен қауіпсіз ережелері бар модерацияланған ата-аналар қоғамдастығы;","аймақтардағы мамандарға телеконсультация мен маршруттау;","нақты жағдайда қандай анықтамалар, мерзімдер мен өтінімдер қажет екенін анықтайтын құжат-ассистент."],
ud:"Интерфейс тыныш, қарапайым және медициналық болмауы керек. Ата-ана үшін қысқа жоспар мен маман үшін кәсіби ақпарат сияқты детализацияның әр түрлі деңгейін қарастырған жөн. Ата-аналар мен мамандар қоғамдастығы модерация, тәлімгерлік және практикалық тәжірибе алмасу арқылы шешімге кіріктірілуі мүмкін."}
},
{id:8,tags:["ai","ui"],
ru:{title:"Коммуникация в ситуациях, где человека не понимают",
sit:"В поликлинике, банке, транспорте, магазине, школе, на работе или в экстренной ситуации человеку с нарушением речи, слуха, зрения или когнитивными особенностями может быть трудно быстро объяснить мысль, задать вопрос, выразить согласие, отказ, боль или просьбу. Собеседник тоже не всегда понимает, как корректно взаимодействовать.",
task:"Разработать технологию, которая помогает человеку быть услышанным в реальной ситуации, а персоналу и окружающим — спокойно и корректно поддержать коммуникацию.",
users:"Человек с нарушением речи, слуха, когнитивными особенностями, персонал ЦОНа, банка, поликлиники, магазина, транспорта, учитель, работодатель, служба экстренной помощи.",
mvp:"Минимум: кликабельный AAC-прототип, набор сценариев для поликлиники/банка/транспорта, демо AI-переформулирования, офлайн-карточка или симулятор для персонала.",
dirs:["мультимодальный AAC-инструмент: текст, пиктограммы, голос, готовые сценарии, быстрые фразы;","AI-помощник для формулирования мысли простым и точным языком;","режим экстренной коммуникации: кто я, что случилось, что нужно, кому позвонить;","тренажёр для персонала через симуляции реальных ситуаций;","офлайн-режим для очереди, транспорта, слабого интернета и стресса;","QR-карточка или персональный профиль коммуникационных предпочтений с контролем доступа."],
ud:"Решение желательно делать понятным для обеих сторон: человека и собеседника. Форматы должны быть визуальными, голосовыми, текстовыми, простыми и быстрыми. Сообщество людей с разным опытом коммуникации может тестировать сценарии и обучать организации более корректному взаимодействию."},
kz:{title:"Адамды түсінбейтін жағдайлардағы коммуникация",
sit:"Емханада, банкте, көлікте, дүкенде, мектепте, жұмыста немесе төтенше жағдайда сөйлеу, есту, көру бұзылысы немесе когнитивтік ерекшеліктері бар адамға ойын жылдам айту, сұрақ қою, келісімін, бас тартуын, ауруын немесе өтінішін білдіру қиын болуы мүмкін. Сұхбаттасушы да дұрыс қарым-қатынас жасауды әрдайым білмейді.",
task:"Адамға нақты жағдайда тыңдалуға, ал персонал мен айналасындағыларға коммуникацияны тыныш және дұрыс қолдауға мүмкіндік беретін технология әзірлеу.",
users:"Сөйлеу, есту бұзылысы бар, когнитивтік ерекшеліктері бар адам, ЦОН, банк, емхана, дүкен, көлік, мектеп персоналы, мұғалім, жұмыс беруші, жедел көмек қызметі.",
mvp:"Минимум: кликабельді AAC-прототип, емхана/банк/көлікке арналған сценарийлер жинағы, AI-қайта тұжырымдау демосы, офлайн-карточка немесе персонал үшін симулятор.",
dirs:["мультимодальды AAC-құрал: мәтін, пиктограммалар, дауыс, дайын сценарийлер, жылдам фразалар;","ойды қарапайым және нақты тілде тұжырымдауға арналған AI-көмекші;","төтенше коммуникация режимі: мен кіммін, не болды, не қажет, кімге қоңырау шалу;","нақты жағдайлардың симуляциялары арқылы персоналды оқыту тренажері;","кезек, көлік, нашар интернет пен стрес үшін офлайн-режим;","қол жеткізуді бақылайтын QR-карточка немесе жеке коммуникациялық артықшылықтар профилі."],
ud:"Шешімді екі тарапқа да: адамға және сұхбаттасушыға түсінікті жасаған жөн. Форматтар визуалды, дауыстық, мәтіндік, қарапайым және жылдам болуы тиіс. Мәселе басқа көзқарастан да қаралу қажет: контекст, тарап, жағдай немесе формат. Қоғамдастық сценарийлерді тестілей алады және ұйымдарды дұрысырақ қарым-қатынасқа үйрете алады."}
},
{id:9,tags:["ai","gov"],
ru:{title:"Качество социальной и реабилитационной поддержки",
sit:"Социальный работник, ассистент, реабилитолог и другие специалисты сопровождают человека в повседневной жизни. Часто информации много, она разрознена, обратная связь от человека собирается нерегулярно, а руководитель поздно видит, где услуга не сработала или где специалист перегружен.",
task:"Разработать технологическое решение, которое помогает сделать поддержку более прозрачной, согласованной, этичной и ориентированной на цели самого человека, а не только на отчётность.",
users:"Получатель услуги, социальный работник, ассистент, реабилитолог, руководитель организации, семья, НПО, местная служба социальной поддержки.",
mvp:"Минимум: прототип карты сопровождения, форма обратной связи в доступном формате, dashboard качества, сценарий раннего сигнала или демо microlearning для специалиста.",
dirs:["цифровая карта сопровождения с целями человека, задачами, динамикой и согласованными действиями;","доступная обратная связь от получателя: голос, пиктограммы, простой текст, анонимный или открытый формат;","dashboard для руководителя: нагрузка специалистов, узкие места, повторяющиеся проблемы;","ранние сигналы риска: ухудшение состояния, пропуски, жалобы, потеря контакта, перегрузка семьи;","короткие microlearning-модули для специалистов под высокую нагрузку;","модель разграничения доступа к данным между человеком, семьёй, специалистами и организацией."],
ud:"Доступность нужна не только получателю услуги, но и специалисту: быстрые формы, понятные подсказки, минимум ручной работы, работа на телефоне и при слабом интернете. НПО и сообщество участвуют в независимой обратной связи и обучении специалистов."},
kz:{title:"Әлеуметтік және оңалту қолдауының сапасы",
sit:"Әлеуметтік қызметкер, ассистент, оңалтушы және басқа мамандар адамды күнделікті өмірде сүйемелдейді. Ақпарат жиі көп, шашыраңқы болады, адамнан кері байланыс үзіліссіз жиналмайды, ал басшы қызмет жұмыс жасамаған немесе маман артық жүктелген жерді кеш байқайды.",
task:"Қолдауды ашық, келісілген, этикалық және тек есептіліктен емес, адамның өз мақсаттарына бағытталған ете алатын технологиялық шешім әзірлеу.",
users:"Қызмет алушы, әлеуметтік қызметкер, ассистент, оңалтушы, ұйым басшысы, отбасы, ҮЕҰ, жергілікті әлеуметтік қолдау қызметі.",
mvp:"Минимум: сүйемелдеу картасының прототипі, қолжетімді форматтағы кері байланыс формасы, сапа dashboardы, ерте сигнал сценарийі немесе маман үшін microlearning демосы.",
dirs:["адамның мақсаттары, тапсырмалары, динамикасы мен келісілген іс-қимылдары бар цифрлық сүйемелдеу картасы;","қызмет алушыдан қолжетімді кері байланыс: дауыс, пиктограммалар, қарапайым мәтін, анонимді немесе ашық формат;","басшыға арналған dashboard: мамандардың жүктемесі, тар жерлер, қайталанатын мәселелер;","ерте тәуекел сигналдары: жағдайдың нашарлауы, өткізіп алулар, шағымдар, байланыс жоғалту;","жоғары жүктемеде мамандарға арналған қысқа microlearning-модульдер;","адам, отбасы, мамандар мен ұйым арасындағы деректерге қол жеткізуді шектеу моделі."],
ud:"Қолжетімділік тек қызмет алушыға ғана емес, маманға да қажет: жылдам формалар, анық нұсқаулар, қолмен жұмысты азайту, телефонда жұмыс жасау және дұрыс емес жұмыс жасаса нашар интернетте. ҮЕҰ мен қоғамдастық тәуелсіз кері байланыста, мамандарды оқытуда және бірлескен шешімдер іздеуде қатыса алады."}
},
{id:10,tags:["event","nav"],
ru:{title:"Участие в культурной, спортивной и общественной жизни",
sit:"Человек может хотеть прийти на концерт, форум, тренировку, фестиваль, выставку, встречу или городское мероприятие, но заранее не понимает, будет ли доступный вход, место, туалет, сопровождение, тихая зона, субтитры, жестовый перевод, понятная регистрация и возможность сообщить о своей потребности.",
task:"Разработать технологическое решение, которое помогает человеку заранее понять условия участия, а организатору — подготовить мероприятие по принципам доступности и универсального дизайна.",
users:"Участник мероприятия, организатор, площадка, волонтёр, спортивная секция, музей, театр, фестиваль, НПО, городской акимат, билетный сервис.",
mvp:"Минимум: прототип формы регистрации, чеклист организатора, карта площадки, сценарий волонтёрского матчинга, демо сенсорной карты или dashboard обратной связи.",
dirs:["инклюзивная регистрация с выбором потребностей и автоматическими подсказками организатору;","event-accessibility planner: чеклист, задачи, ответственные, дедлайны, карта площадки;","сенсорная карта мероприятия: шум, свет, толпа, тихие зоны, маршруты отдыха;","цифровой матчинг волонтёров сопровождения и участников с понятными правилами;","сканер доступности площадки до мероприятия: фото, маршрут, туалет, вход, рассадка;","обратная связь после события в доступном формате с аналитикой для организатора."],
ud:"Универсальный дизайн события делает участие удобнее для всех: понятная навигация, спокойные зоны, разные форматы информации, доступная регистрация, заранее известные условия. Сообщество людей с инвалидностью может быть не только аудиторией, но и экспертами, волонтёрами, спикерами и соорганизаторами."},
kz:{title:"Мәдени, спорттық және қоғамдық өмірге қатысу",
sit:"Адам концертке, форумға, жаттығуға, фестивальге, көрмеге, кездесуге немесе қалалық іс-шараға келгісі келуі мүмкін, бірақ алдын ала кіреберіс, орын, дәретхана, сүйемелдеу, тыныш аймақ, субтитрлер, ымдау тілі аудармасы, анық тіркеу мен қажеттілігін хабарлау мүмкіндігі болады ма, білмейді.",
task:"Адамға алдын ала қатысу жағдайларын анықтауға, ал ұйымдастырушыға іс-шараны қолжетімділік пен жалпыға бірдей дизайн қағидаттары бойынша дайындауға мүмкіндік беретін технологиялық шешім әзірлеу.",
users:"Іс-шара қатысушысы, ұйымдастырушы, алаң, волонтер, спорт секциясы, мұражай, театр, фестиваль, ҮЕҰ, қалалық әкімдік, билет сервисі.",
mvp:"Минимум: тіркеу форма прототипі, ұйымдастырушының тізімтізбесі, алаң картасы, волонтерлық матчинг сценарийі, сенсорлық картаның демосы немесе кері байланыс dashboardы.",

let lang='ru';
const ICONS={sit:'\u{1F4CD}',task:'\u26A1',users:'\u{1F465}',dirs:'\u{1F6E0}',ud:'\u267F',result:'\u{1F3AF}'};

function toggleBlock(id){document.getElementById(id).classList.toggle('open')}

function applyUI(){
  const u=UI[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(u[k]!==undefined)el.textContent=u[k];});
  document.documentElement.lang=lang;
}

function buildWelcome(){
  const l=document.getElementById('welcomeList');l.innerHTML='';
  UI[lang].welcomeItems.forEach(t=>{const li=document.createElement('li');li.textContent=t;l.appendChild(li);});
}

function buildChecklist(){
  const u=UI[lang],w=document.getElementById('checklistTable');
  let h='<table class="checklist-table"><tr>';
  u.checklistCols.forEach(c=>{h+=`<th>${c}</th>`;});h+='</tr>';
  u.checklistRows.forEach(r=>{h+='<tr>';r.forEach((c,i)=>{h+=`<td>${c}</td>`;});h+='</tr>';});
  w.innerHTML=h+'</table>';
}



function buildNav(){
  const u=UI[lang],nav=document.getElementById('navScroll');nav.innerHTML='';
  [...CASES,{id:11}].forEach(c=>{
    const b=document.createElement('button');b.className='nav-pill';b.dataset.caseId=String(c.id);
    b.textContent=`${u.caseLabel} ${c.id}`;b.setAttribute('role','listitem');
    b.addEventListener('click',()=>{const el=document.getElementById('case-'+c.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
    nav.appendChild(b);
  });
}

function mkSection(icon,label,bodyFn,open){
  const d=document.createElement('details');if(open)d.setAttribute('open','');
  const s=document.createElement('summary');
  s.innerHTML=`<span class="sum-icon">${icon}</span>${label}<span class="sum-arrow">&#9662;</span>`;
  d.appendChild(s);d.appendChild(bodyFn());return d;
}
function textDiv(text){const w=document.createElement('div');w.className='sec-content';const p=document.createElement('p');p.textContent=text;w.appendChild(p);return w;}
function listDiv(items){
  const w=document.createElement('div');w.className='sec-content';
  const ul=document.createElement('ul');
  items.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
  w.appendChild(ul);return w;
}
function tableDiv(u,usersText,mvpText){
  const w=document.createElement('div');w.className='case-table-wrap';
  const t=document.createElement('table');t.className='case-table';
  t.innerHTML=`<tr><th>${u.tblUsers}</th><th>${u.tblMvp}</th></tr><tr><td>${usersText}</td><td>${mvpText}</td></tr>`;
  w.appendChild(t);return w;
}
function udDiv(text){const w=document.createElement('div');w.className='sec-content';const b=document.createElement('div');b.className='ud-box';const p=document.createElement('p');p.textContent=text;b.appendChild(p);w.appendChild(b);return w;}
function resultDiv(text){const w=document.createElement('div');w.className='sec-content';const b=document.createElement('div');b.className='result-box';const p=document.createElement('p');p.textContent=text;b.appendChild(p);w.appendChild(b);return w;}

function buildCard(id,isCase11){
  const u=UI[lang];
  const d=isCase11?CASE11[lang]:CASES.find(c=>c.id===id)[lang];
  const cas=isCase11?null:CASES.find(c=>c.id===id);
  const card=document.createElement('article');
  card.className='case-card open'+(isCase11?' case-11':'');
  card.id='case-'+id;card.dataset.caseId=String(id);
  const tagHtml=isCase11?'':cas.tags.map(t=>`<span class="case-tag">${u.techTags[t]||t}</span>`).join('');
  const hdr=document.createElement('button');hdr.className='case-header';hdr.setAttribute('aria-expanded','true');
  hdr.innerHTML=`<span class="case-num">${String(id).padStart(2,'0')}</span><span class="case-header-text"><span class="case-title">${d.title}</span><span class="case-tags">${tagHtml}</span></span><span class="case-toggle" aria-hidden="true">&#9662;</span>`;
  hdr.addEventListener('click',()=>{const open=card.classList.toggle('open');hdr.setAttribute('aria-expanded',String(open));});
  const body=document.createElement('div');body.className='case-body';
  body.appendChild(mkSection(ICONS.sit,u.secSit,()=>textDiv(d.sit),true));
  body.appendChild(mkSection(ICONS.task,u.secTask,()=>textDiv(d.task),true));
  body.appendChild(mkSection(ICONS.users,u.secUsers,()=>tableDiv(u,d.users,d.mvp),false));
  body.appendChild(mkSection(ICONS.dirs,u.secDirs,()=>listDiv(d.dirs),false));
  body.appendChild(mkSection(ICONS.ud,u.secUD,()=>udDiv(d.ud),false));
  body.appendChild(mkSection(ICONS.result,u.secResult,()=>resultDiv(u.resultText),false));
  card.appendChild(hdr);card.appendChild(body);return card;
}

function buildCases(){
  const c=document.getElementById('casesContainer');c.innerHTML='';
  CASES.forEach(cas=>c.appendChild(buildCard(cas.id,false)));
  c.appendChild(buildCard(11,true));
}

function buildSelfCheck(){
  const u=UI[lang],l=document.getElementById('selfCheckList');l.innerHTML='';
  u.selfCheckItems.forEach(q=>{const li=document.createElement('li');li.textContent=q;l.appendChild(li);});
}

function setupObserver(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id=e.target.dataset.caseId;
        document.querySelectorAll('.nav-pill').forEach(p=>{
          const a=p.dataset.caseId===id;p.classList.toggle('active',a);
          if(a)p.setAttribute('aria-current','true');else p.removeAttribute('aria-current');
        });
      }
    });
  },{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('.case-card').forEach(c=>obs.observe(c));
}

window.addEventListener('scroll',()=>{document.getElementById('backTop').classList.toggle('visible',window.scrollY>300);});

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    lang=btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
    render();
  });
});

function render(){
  applyUI();buildWelcome();buildChecklist();
  buildNav();buildCases();buildSelfCheck();
  setupObserver();
}
render();
</script>
